<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>SENAI Gothic</title>

  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <nav class="navbar">
    <div class="logo">🦇 SENAI <span>GOTHIC</span></div>
    <button id="toggleTema" class="tema-btn">🌙</button>
  </nav>

  <main class="container">

    <h1>SENAI <span>GOTHIC</span></h1>
    <p class="subtitle">Entre nas sombras do conhecimento industrial...</p>

    <div id="conteudo">
      <div class="tela">

        <div id="chatArea" class="chat-area">
          <div class="msg-container">
            <div class="avatar">🦇</div>
            <div class="msg bot">Eu sou Vlad Tepes... guardião do SENAI...</div>
          </div>
        </div>

        <div class="chat-input">
          <input id="inputChat" placeholder="Fale com Vlad Tepes..." />

          <button id="btnEnviar">Enviar</button>
          <button id="btnMic">🎤</button>
          <button id="btnAudio">🔊 Áudio</button>

        </div>

      </div>
    </div>

  </main>

  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script src="script.js"></script>
</body>
</html>
